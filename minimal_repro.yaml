agent_cls: skyrl_agent.agents.react.ReActAgent

task: skyrl_agent.tasks.general_react.utils.GeneralReactTask

tools: ["finish"]

data:
  data_source_key: data_source

generator:
  infer_backend: openai_server
  backend_config:
    model_name: ${oc.env:REPRO_MODEL,Qwen/Qwen2.5-1.5B-Instruct}
    api_url: ${oc.env:REPRO_API_URL,http://localhost:8000}
    model_max_len: 16384
  num_trajectories: 1
  max_iterations: 6
  # The agent requests max_tokens ~= max_prompt_length on the first step, so
  # max_prompt_length + the prompt tokens must stay under the served model's
  # context (vLLM --max-model-len=16384). 4096 leaves ample headroom.
  max_prompt_length: 4096
  sampling_params:
    temperature: 0.5
    top_p: 0.95
    max_tokens: 1024
  val_config:
    num_trajectories: 1
    sampling_params:
      temperature: 0.7
      top_p: 0.95
      max_tokens: 1024
  remove_think_tokens: false
  vision_is_active: false
  qwen3_enable_thinking: false
  qwen3_acc_thinking: false
  early_step_threshold: 3
  enable_turn_reminder: true

dispatcher:
  type: async_batch
  scheduler: naive
  max_parallel_agents: 4
  max_eval_parallel_agents: 4
